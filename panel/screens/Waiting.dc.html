<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MatrixKoder Waiting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#4fd1c5}a:hover{color:#7fe3d9}
.mk{font-family:'Geist',system-ui,sans-serif;color:#b9e8c4;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #143d22;background:#06150b;color:#8bbf9a;cursor:pointer;padding:0;text-decoration:none;box-sizing:border-box}
.ib:hover{background:#0c2414;color:#b9e8c4}
.btn{font-family:'Geist',system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid #143d22;background:#06150b;color:#b9e8c4;text-decoration:none;box-sizing:border-box}
.btn:hover{background:#0c2414;color:#b9e8c4}
.btn.pri{background:#19e35a;border-color:#19e35a;color:#021006;font-weight:600}
.btn.amb{background:#e8b04a;border-color:#e8b04a;color:#1a1204;font-weight:600}
.btn.amb:hover{background:#f0c26a;color:#1a1204}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.tab{font-family:'Geist',system-ui,sans-serif;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 9px;border:0;border-radius:9px;background:transparent;color:#7fae8c;font-size:10px;font-weight:500;letter-spacing:-.01em;cursor:pointer;position:relative;white-space:nowrap;text-decoration:none}
.tab:hover{color:#b9e8c4;background:#06150b}
.tab.on{background:#0d2a16;color:#e6fff0}
.badge{position:absolute;top:3px;right:4px;min-width:16px;height:16px;border-radius:8px;font-size:10px;font-weight:600;line-height:16px;text-align:center;padding:0 4px;box-sizing:border-box}
.rain{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.rcol{position:absolute;top:0;width:14px;font-family:'Geist Mono',ui-monospace,monospace;font-size:13px;line-height:15px;text-align:center;white-space:pre-line;color:#19e35a;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 85%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 85%,#000 100%);animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{from{transform:translateY(-110%)}to{transform:translateY(1300px)}}
.slot{font-family:'Geist',system-ui,sans-serif;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:9px;border:1px dashed #1c4a2b;background:transparent;color:#5f9a70;font-size:12px;cursor:default}
.kbd{font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.18);margin-left:2px}
.card{border-radius:14px;background:rgba(4,17,10,.84);backdrop-filter:blur(3px);border:1px solid #0f2a17}
.pill{display:inline-flex;align-items:center;justify-content:center;height:20px;padding:0 7px;border-radius:6px;font-size:10.5px;font-weight:600;white-space:nowrap}
.fchip{font-family:'Geist',system-ui,sans-serif;height:30px;padding:0 12px;border-radius:15px;border:1px solid #143d22;background:rgba(6,21,11,.85);color:#8bbf9a;font-size:12px;cursor:pointer}
.fchip:hover{color:#e6fff0}
.fchip.on{background:#0d2a16;border-color:#19e35a;color:#e6fff0}
.ev{font-family:'Geist',system-ui,sans-serif;width:100%;border:0;border-top:1px solid #0d2414;background:transparent;padding:10px 12px;display:grid;grid-template-columns:52px 64px minmax(0,1fr);gap:8px;align-items:start;text-align:left;color:inherit;cursor:pointer}
.ev:hover{background:rgba(13,42,22,.5)}
.live{width:7px;height:7px;border-radius:50%;background:#19e35a;box-shadow:0 0 0 3px rgba(25,227,90,.2)}
</style>
</helmet>
<div class="mk" style="width: 440px; height: 1240px; box-sizing: border-box; background: #020604; display: flex; flex-direction: column; border-left: 1px solid #0f2a17; position: relative; overflow: hidden">

  <div class="rain" aria-hidden="true">
    <sc-for list="{{rain}}" as="c" hint-placeholder-count="0">
      <div class="rcol" style="{{c.style}}">{{c.glyphs}}</div>
    </sc-for>
  </div>

  <header style="position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px">
    <div style="width: 30px; height: 30px; border-radius: 8px; background: #0d2a16; border: 1px solid #19e35a; display: flex; align-items: center; justify-content: center; color: #19e35a">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5z"></path><path d="m2 17 10 5 10-5"></path><path d="m2 12 10 5 10-5"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
      <span style="font-size: 14px; font-weight: 700; letter-spacing: .02em; color: #e6fff0">MatrixKoder</span>
      <button style="font-family: 'Geist', system-ui, sans-serif; align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; color: #8bbf9a; font-size: 12px; cursor: pointer">auth-v2-refactor <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>
    <button class="ib" aria-label="Sweep lanes now"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg></button>
    <a class="ib" href="Settings.dc.html" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg></a>
  </header>

  <nav aria-label="MatrixKoder sections" style="position: relative; z-index: 1; display: flex; gap: 2px; margin: 0 10px; padding: 4px; border-radius: 12px; background: rgba(4,14,7,.86); backdrop-filter: blur(3px); border: 1px solid #0f2a17">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="8">
      <sc-if value="{{t.isLink}}" hint-placeholder-val="{{true}}">
      <a class="{{t.cls}}" href="{{t.href}}" aria-current="{{t.cur}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
        <sc-if value="{{t.hasBadge}}" hint-placeholder-val="{{false}}"><span class="badge" style="{{t.badgeStyle}}">{{t.badge}}</span></sc-if>
      </a>
      </sc-if>
      <sc-if value="{{t.isBtn}}" hint-placeholder-val="{{false}}">
      <button class="{{t.cls}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
        <sc-if value="{{t.hasBadge}}" hint-placeholder-val="{{false}}"><span class="badge" style="{{t.badgeStyle}}">{{t.badge}}</span></sc-if>
      </button>
      </sc-if>
    </sc-for>
  </nav>

  <main style="position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; overflow: hidden">

    <div style="display: flex; align-items: center; gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 15px; font-weight: 600; color: #e6fff0">Waiting on you</h1>
        <span style="font-size: 12px; color: #8bbf9a">{{countLabel}}</span>
      </div>
    </div>

    <sc-if value="{{allClear}}" hint-placeholder-val="{{false}}">
      <section class="card" style="padding: 16px; display: flex; align-items: center; gap: 10px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#19e35a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
        <span style="font-size: 13px; color: #b9e8c4">Nothing needs you. Lanes are running on their own.</span>
      </section>
    </sc-if>

    <sc-for list="{{asks}}" as="a" hint-placeholder-count="2">
      <section aria-label="{{a.title}}" style="{{a.boxStyle}}">
        <div style="display: flex; align-items: center; gap: 8px">
          <span class="pill" style="{{a.kindStyle}}">{{a.kind}}</span>
          <span style="flex: 1"></span>
          <span class="mono" style="font-size: 11px; color: #b8975a">{{a.src}}</span>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #fff3da">{{a.title}}</div>
        <div style="font-size: 13px; line-height: 19px; color: #d9c49a">{{a.body}}</div>
        <sc-if value="{{a.hasRec}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; align-items: center; gap: 8px; border-radius: 10px; background: #04110a; border: 1px solid #1f6b5f; padding: 8px 10px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M7 21h10M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path></svg>
            <span style="font-size: 12px; line-height: 17px; color: #b9e8c4; flex: 1">{{a.rec}}</span>
          </div>
        </sc-if>
        <sc-if value="{{a.isGate}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <button class="btn amb" onClick="{{a.approve}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Approve</button>
            <button class="btn" style="border-color: #5c4515; background: #1a1406; color: #f0d9a8" onClick="{{a.rework}}">Request rework</button>
            <button class="btn" style="border-color: transparent; background: transparent; color: #d9b36a; padding: 0 8px">Details</button>
          </div>
        </sc-if>
        <sc-if value="{{a.isQuestion}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            <sc-for list="{{a.options}}" as="o" hint-placeholder-count="2">
              <button class="btn sm" style="border-color: #5c4515; background: #1a1406; color: #f0d9a8" onClick="{{o.pick}}">{{o.label}}</button>
            </sc-for>
          </div>
        </sc-if>
      </section>
    </sc-for>

    <sc-if value="{{hasDone}}" hint-placeholder-val="{{true}}">
      <section class="card" aria-label="Resolved today" style="overflow: hidden">
        <div style="padding: 10px 12px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #7fae8c">Resolved today</div>
        <sc-for list="{{done}}" as="d" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid #0d2414">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#19e35a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
            <span style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0">
              <span style="font-size: 12.5px; color: #e6fff0">{{d.title}}</span>
              <span class="mono" style="font-size: 10.5px; color: #7fae8c">{{d.outcome}} · {{d.src}}</span>
            </span>
            <sc-if value="{{d.canUndo}}" hint-placeholder-val="{{false}}"><button class="btn sm" onClick="{{d.undo}}">Undo</button></sc-if>
          </div>
        </sc-for>
      </section>
    </sc-if>

  </main>

  <footer style="position: relative; z-index: 1; border-top: 1px solid #0f2a17; background: rgba(3,10,6,.92); backdrop-filter: blur(4px)">
    <div role="toolbar" aria-label="Shortcuts" style="display: flex; gap: 8px; padding: 12px 16px 16px; flex-wrap: wrap">
      <button class="btn pri" aria-label="Improve prompt"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 17v4M17 19h4"></path></svg>Improve<span class="kbd">⌃I</span></button>
      <button class="btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M7 21h10M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path><path d="m16 16 3-8 3 8c-.9.6-1.9 1-3 1s-2.1-.4-3-1z"></path><path d="m2 16 3-8 3 8c-.9.6-1.9 1-3 1s-2.1-.4-3-1z"></path></svg>Ask Jev<span class="kbd">⌃J</span></button>
      <button class="slot" disabled="" aria-label="Empty shortcut slot">+ shortcut</button>
      <button class="slot" disabled="" aria-label="Empty shortcut slot">+</button>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":1240}}'>
const GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789';
function rng(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function makeRain(seed) {
  const R = rng(seed), out = [];
  for (let i = 0; i < 30; i++) {
    const n = 14 + Math.floor(R() * 26), g = [];
    for (let k = 0; k < n; k++) g.push(GLYPHS[Math.floor(R() * GLYPHS.length)]);
    const dur = 7 + R() * 9, delay = -R() * dur, op = 0.16 + R() * 0.22;
    out.push({ glyphs: g.join('\n'), style: 'left:' + (i * 14.6 + R() * 4).toFixed(1) + 'px;opacity:' + op.toFixed(2) + ';animation-duration:' + dur.toFixed(1) + 's;animation-delay:' + delay.toFixed(1) + 's' });
  }
  return out;
}
const RAIN = makeRain(53);
const TABS = [
  ['projects', 'Projects', 'M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z', 'Projects.dc.html'],
  ['overview', 'Overview', 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z', 'Main.dc.html'],
  ['lanes', 'Lanes', 'M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9', 'Lanes.dc.html'],
  ['plan', 'Plan', 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01', 'Plan.dc.html'],
  ['waiting', 'Waiting', 'M12 8v4M12 16h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0z', 'Waiting.dc.html'],
  ['events', 'Events', 'M22 12h-4l-3 9L9 3l-3 9H2', 'Events.dc.html'],
  ['inbox', 'Inbox', 'M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z', 'Inbox.dc.html'],
  ['bugs', 'Bugs', 'M8 2l1.9 1.9M16 2l-1.9 1.9M9 7.1V6a3 3 0 0 1 6 0v1.1M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6zM12 20v-9M6.5 13H3M21 13h-3.5M6 7.5 3.5 6M18 7.5 20.5 6', 'Bugs.dc.html'],
  ['todo', 'Todo', 'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11', 'Todo.dc.html'],
];
const BADGES = { lanes: ['3', 'background:#0a2f2c;color:#4fd1c5'], waiting: ['1', 'background:#e8b04a;color:#1a1204'], inbox: ['2', 'background:#0f2a17;color:#b9e8c4'], bugs: ['4', 'background:#3a1512;color:#ff9b8a'] };
function tabs(active) {
  return TABS.map(([id, label, icon, href]) => {
    const b = BADGES[id];
    return { label, icon, href, isLink: !!href, isBtn: !href, cur: id === active ? 'page' : 'false', cls: 'tab' + (id === active ? ' on' : ''), hasBadge: !!b, badge: b ? b[0] : '', badgeStyle: b ? b[1] : '' };
  });
}
const KIND = {
  gate: ['Decision gate', 'background:#221b08;color:#e8b04a'],
  question: ['Question', 'background:#0a2f2c;color:#4fd1c5'],
};
const ASKS = [
  { id: 'w1', kind: 'gate', src: 'P2 · codex · T7 · 2m', title: 'Security review: 2 public routes exposed', body: 'The reviewer found /admin/export and /debug/session reachable without auth in middleware.ts. Approve the fix plan, or send it back.', rec: 'Jev: approve. The fix plan covers both routes and adds guard tests.' },
  { id: 'w2', kind: 'question', src: 'P3 · claude · T9 · 6m', title: 'Keep the in-memory session store?', body: 'Wave 3 can move sessions to the Redis pool now, or keep the in-memory store until after the PR. Not blocking: P3 waits on wave 3 anyway.', rec: '', options: ['Move to Redis', 'Keep in-memory', 'Ask me later'] },
];
const RESOLVED = [
  { id: 'r1', title: 'Approve the wave 2 plan', outcome: 'Approved', src: 'orchestrator · 11:58' },
  { id: 'r2', title: 'Route T6 to claude opus high', outcome: 'Accepted Jev pick', src: 'Jev · 11:41' },
];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { answers: {} }; }
  renderVals() {
    const s = this.state;
    const answer = (id, outcome) => this.setState({ answers: { ...s.answers, [id]: outcome } });
    const open = ASKS.filter((a) => !s.answers[a.id]);
    const blocking = open.filter((a) => a.kind === 'gate').length;
    const questions = open.length - blocking;
    const mine = ASKS.filter((a) => s.answers[a.id]).map((a) => ({
      title: a.title, outcome: s.answers[a.id], src: a.src.split(' · ').slice(0, 2).join(' · ') + ' · just now',
      canUndo: true, undo: () => { const n = { ...s.answers }; delete n[a.id]; this.setState({ answers: n }); },
    }));
    const done = mine.concat(RESOLVED.map((r) => ({ ...r, canUndo: false, undo: null })));
    return {
      rain: RAIN,
      tabs: tabs('waiting'),
      countLabel: blocking + ' blocking · ' + questions + (questions === 1 ? ' question' : ' questions'),
      allClear: open.length === 0,
      asks: open.map((a) => ({
        ...a,
        kind: KIND[a.kind][0], kindStyle: KIND[a.kind][1],
        boxStyle: a.kind === 'gate'
          ? 'border-radius:14px;background:#120e04;border:1px solid #5c4515;padding:14px 16px;display:flex;flex-direction:column;gap:10px'
          : 'border-radius:14px;background:rgba(4,17,10,.86);backdrop-filter:blur(3px);border:1px solid #1f6b5f;padding:14px 16px;display:flex;flex-direction:column;gap:10px',
        hasRec: !!a.rec,
        isGate: a.kind === 'gate', isQuestion: a.kind === 'question',
        approve: () => answer(a.id, 'Approved'),
        rework: () => answer(a.id, 'Sent back for rework'),
        options: (a.options || []).map((label) => ({ label, pick: () => answer(a.id, 'Answered: ' + label) })),
      })),
      hasDone: done.length > 0,
      done,
    };
  }
}
</script>
</body>
</html>
