<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings · Shortcuts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#4fd1c5}a:hover{color:#7fe3d9}
.mk{font-family:'Geist',system-ui,sans-serif;color:#b9e8c4;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #143d22;background:#06150b;color:#8bbf9a;cursor:pointer;padding:0;text-decoration:none;box-sizing:border-box}
.ib:hover{background:#0c2414;color:#b9e8c4}
.ib[disabled]{opacity:.35;cursor:default}
.btn{font-family:'Geist',system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #143d22;background:#06150b;color:#b9e8c4;text-decoration:none;box-sizing:border-box;white-space:nowrap}
.btn:hover{background:#0c2414;color:#b9e8c4}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.fbtn{font-family:'Geist',system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:500;border:1px solid #143d22;background:#06150b;color:#b9e8c4;white-space:nowrap}
.fbtn.pri{background:#19e35a;border-color:#19e35a;color:#021006;font-weight:600}
.slot{font-family:'Geist',system-ui,sans-serif;display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:9px;border:1px dashed #1c4a2b;color:#5f9a70;font-size:12px}
.kbd{font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.18)}
.rain{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.rcol{position:absolute;top:0;width:14px;font-family:'Geist Mono',ui-monospace,monospace;font-size:13px;line-height:15px;text-align:center;white-space:pre-line;color:#19e35a;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 85%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 85%,#000 100%);animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{from{transform:translateY(-110%)}to{transform:translateY(1300px)}}
.stab{font-family:'Geist',system-ui,sans-serif;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:7px;color:#7fae8c;font-size:9.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.stab:hover{color:#b9e8c4;background:#06150b}
.stab.on{background:#0d2a16;color:#e6fff0}
.card{border-radius:14px;background:rgba(4,17,10,.86);backdrop-filter:blur(3px);border:1px solid #0f2a17;padding:4px 14px}
.sec{margin:0;padding:12px 0 6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8bbf9a;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #0d2414}
.lbl{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.lbl span:first-child{font-size:13px;color:#e6fff0}
.lbl span:last-child{font-size:11.5px;line-height:16px;color:#7fae8c}
.search{font-family:'Geist',system-ui,sans-serif;width:100%;height:36px;box-sizing:border-box;padding:0 12px 0 34px;border-radius:9px;border:1px solid #1c4a2b;background:#020a05;color:#e6fff0;font-size:13px;outline:none}
.search:focus{border-color:#19e35a}
.search::placeholder{color:#5f9a70}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="mk" style="width: 440px; height: 1240px; box-sizing: border-box; background: #020604; display: flex; flex-direction: column; border-left: 1px solid #0f2a17; position: relative; overflow: hidden">

  <div class="rain" aria-hidden="true">
    <sc-for list="{{rain}}" as="c" hint-placeholder-count="0">
      <div class="rcol" style="{{c.style}}">{{c.glyphs}}</div>
    </sc-for>
  </div>

  <header style="position: relative; z-index: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 14px; border-bottom: 1px solid #0f2a17; background: rgba(3,10,6,.92)">
    <div style="display: flex; align-items: center; gap: 10px">
      <a class="ib" href="Main.dc.html" aria-label="Back to Overview"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 15px; font-weight: 600; color: #e6fff0">Settings</h1>
        <span style="font-size: 12px; color: #8bbf9a">MatrixKoder · {{repoName}}</span>
      </div>
    </div>
    <div style="position: relative">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7fae8c" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 12px; top: 11px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="ss" class="sr">Search settings</label>
      <input id="ss" class="search" placeholder="Search all settings">
    </div>
    <nav aria-label="Settings sections" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(4,14,7,.86); border: 1px solid #0f2a17">
      <sc-for list="{{stabs}}" as="s" hint-placeholder-count="7"><a class="{{s.cls}}" href="{{s.href}}" aria-current="{{s.cur}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg><span>{{s.label}}</span></a></sc-for>
    </nav>
  </header>

  <main style="position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 20px; overflow: hidden">

    <section class="card" aria-labelledby="k-bar">
      <h2 id="k-bar" class="sec">In the footer<span class="mono" style="font-weight: 500; letter-spacing: 0; color: #7fae8c">{{used}}/4</span></h2>
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="2">
        <div class="row">
          <div class="lbl"><span>{{s.label}}</span><span>{{s.desc}}</span></div>
          <span class="kbd" style="color: #b9e8c4">{{s.key}}</span>
          <button class="ib" style="width: 28px; height: 28px" aria-label="Move {{s.label}} left" disabled="{{s.first}}" onClick="{{s.up}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button>
          <button class="ib" style="width: 28px; height: 28px" aria-label="Move {{s.label}} right" disabled="{{s.last}}" onClick="{{s.down}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button class="ib" style="width: 28px; height: 28px; color: #ff9b8a" aria-label="Remove {{s.label}}" onClick="{{s.remove}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
      </sc-for>
      <div style="height: 4px"></div>
    </section>

    <section class="card" aria-labelledby="k-lib">
      <h2 id="k-lib" class="sec">Add from library</h2>
      <sc-for list="{{library}}" as="l" hint-placeholder-count="5">
        <div class="row">
          <div class="lbl"><span>{{l.label}}</span><span>{{l.desc}}</span></div>
          <button class="btn" disabled="{{l.full}}" onClick="{{l.add}}">Add</button>
        </div>
      </sc-for>
      <div class="row" style="padding-bottom: 12px"><button class="btn" style="border-style: dashed; color: #8bbf9a" disabled title="Not supported in web dashboard">+ Custom: MK command or Orca automation</button></div>
    </section>

    <section aria-label="Footer preview" style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #8bbf9a; padding: 0 2px">Preview</span>
      <div style="border-radius: 12px; border: 1px solid #0f2a17; background: rgba(3,10,6,.92); padding: 12px; display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{preview}}" as="b" hint-placeholder-count="2"><span class="{{b.cls}}">{{b.label}}<span class="kbd">{{b.key}}</span></span></sc-for>
        <sc-for list="{{empties}}" as="e" hint-placeholder-count="2"><span class="slot">+</span></sc-for>
      </div>
    </section>

  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":1240}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { slots: ['improve', 'jev'] };
  }
  renderVals() {
    const slots = this.state.slots;
    const maxSlots = 4;
    const full = slots.length >= maxSlots;
    const proj = this.getData('projects') || {};
    const repo = (proj.repos && proj.repos[0]) || {};
    const repoName = repo.name || 'orca-matrixkoder';

    const libDefs = {
      improve: ['Improve', 'Rewrites the prompt before it is sent', '⌃I'],
      jev: ['Ask Jev', 'A judgment on the current run', '⌃J'],
      sweep: ['Sweep lanes', 'Check every lane for stalls now', '⌃S'],
      next: ['Run next phase', 'Start the next phase when the current one merged', '⌃N'],
      verify: ['Re-verify all', 'Rerun build and test gates on every lane', '⌃R'],
      pr: ['Open PR', 'Open the plan PR in Orca', '⌃P'],
      todo: ['New todo', 'Add to Todo without leaving the screen', '⌃T'],
    };

    const setSlots = (next) => {
      this.setState({ slots: next });
      this.action('settings.save', { patch: { shortcuts: { footer: next } } });
    };

    const move = (i, d) => {
      const n = slots.slice();
      const t = n[i];
      n[i] = n[i + d];
      n[i + d] = t;
      setSlots(n);
    };

    const emptyCount = Math.max(0, maxSlots - slots.length);
    const empties = [];
    for (let i = 0; i < emptyCount; i++) empties.push({ id: i });

    return {
      rain: window.MK_RAIN ? window.MK_RAIN(107) : [],
      stabs: window.MK_STABS ? window.MK_STABS('shortcuts') : [],
      repoName,
      used: slots.length,
      slots: slots.map((id, i) => ({
        label: libDefs[id] ? libDefs[id][0] : id,
        desc: libDefs[id] ? libDefs[id][1] : '',
        key: libDefs[id] ? libDefs[id][2] : '',
        first: i === 0,
        last: i === slots.length - 1,
        up: () => move(i, -1),
        down: () => move(i, 1),
        remove: () => setSlots(slots.filter((x) => x !== id)),
      })),
      library: Object.keys(libDefs).filter((id) => slots.indexOf(id) < 0).map((id) => ({
        label: libDefs[id][0],
        desc: libDefs[id][1],
        full,
        add: () => setSlots([...slots, id]),
      })),
      preview: slots.map((id, i) => ({
        label: libDefs[id] ? libDefs[id][0] : id,
        key: libDefs[id] ? libDefs[id][2] : '',
        cls: 'fbtn' + (i === 0 ? ' pri' : ''),
      })),
      empties,
    };
  }
}
</script>
</body>
</html>
