<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MatrixKoder Plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#4fd1c5}a:hover{color:#7fe3d9}
.mk{font-family:'Geist',system-ui,sans-serif;color:#b9e8c4;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #143d22;background:#06150b;color:#8bbf9a;cursor:pointer;padding:0;text-decoration:none;box-sizing:border-box}
.ib:hover{background:#0c2414;color:#b9e8c4}
.btn{font-family:'Geist',system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid #143d22;background:#06150b;color:#b9e8c4;text-decoration:none;box-sizing:border-box}
.btn:hover{background:#0c2414;color:#b9e8c4}
.btn.pri{background:#19e35a;border-color:#19e35a;color:#021006;font-weight:600}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.tab{font-family:'Geist',system-ui,sans-serif;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 9px;border:0;border-radius:9px;background:transparent;color:#7fae8c;font-size:10px;font-weight:500;letter-spacing:-.01em;cursor:pointer;position:relative;white-space:nowrap;text-decoration:none}
.tab:hover{color:#b9e8c4;background:#06150b}
.tab.on{background:#0d2a16;color:#e6fff0}
.badge{position:absolute;top:3px;right:4px;min-width:16px;height:16px;border-radius:8px;font-size:10px;font-weight:600;line-height:16px;text-align:center;padding:0 4px;box-sizing:border-box}
.rain{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.rcol{position:absolute;top:0;width:14px;font-family:'Geist Mono',ui-monospace,monospace;font-size:13px;line-height:15px;text-align:center;white-space:pre-line;color:#19e35a;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 85%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 85%,#000 100%);animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{from{transform:translateY(-110%)}to{transform:translateY(1300px)}}
.slot{font-family:'Geist',system-ui,sans-serif;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:9px;border:1px dashed #1c4a2b;background:transparent;color:#5f9a70;font-size:12px;cursor:default}
.kbd{font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.18);margin-left:2px}
.card{border-radius:14px;background:rgba(4,17,10,.84);backdrop-filter:blur(3px);border:1px solid #0f2a17}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:600;white-space:nowrap}
.node{font-family:'Geist',system-ui,sans-serif;border:0;background:transparent;margin:0;display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;color:inherit;border-radius:8px;box-sizing:border-box}
.node:hover{background:#06150b}
.kids{display:flex;flex-direction:column;gap:2px;padding-left:20px;border-left:1px solid #0f2a17;margin-left:12px}
.chev{width:16px;height:16px;flex-shrink:0;transition:transform .12s ease}
.dot{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cnt{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:#7fae8c;padding:0 6px}
</style>
</helmet>
<div class="mk" style="width: 440px; height: 1240px; box-sizing: border-box; background: #020604; display: flex; flex-direction: column; border-left: 1px solid #0f2a17; position: relative; overflow: hidden">

  <div class="rain" aria-hidden="true">
    <sc-for list="{{rain}}" as="c">
      <div class="rcol" style="{{c.style}}">{{c.glyphs}}</div>
    </sc-for>
  </div>

  <header style="position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px">
    <div style="width: 30px; height: 30px; border-radius: 8px; background: #0d2a16; border: 1px solid #19e35a; display: flex; align-items: center; justify-content: center; color: #19e35a">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5z"></path><path d="m2 17 10 5 10-5"></path><path d="m2 12 10 5 10-5"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
      <span style="font-size: 14px; font-weight: 700; letter-spacing: .02em; color: #e6fff0">MatrixKoder</span>
      <button style="font-family: 'Geist', system-ui, sans-serif; align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; color: #8bbf9a; font-size: 12px; cursor: pointer; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{planTitle}} <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>
    <button class="ib" aria-label="Sweep lanes now" onClick="{{sweepLanes}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg></button>
    <a class="ib" href="Settings.dc.html" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></a>
  </header>

  <nav aria-label="MatrixKoder sections" style="position: relative; z-index: 1; display: flex; gap: 2px; margin: 0 10px; padding: 4px; border-radius: 12px; background: rgba(4,14,7,.86); backdrop-filter: blur(3px); border: 1px solid #0f2a17">
    <sc-for list="{{tabs}}" as="t">
      <sc-if value="{{t.isLink}}">
      <a class="{{t.cls}}" href="{{t.href}}" aria-current="{{t.cur}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
        <sc-if value="{{t.hasBadge}}"><span class="badge" style="{{t.badgeStyle}}">{{t.badge}}</span></sc-if>
      </a>
      </sc-if>
      <sc-if value="{{t.isBtn}}">
      <button class="{{t.cls}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
        <sc-if value="{{t.hasBadge}}"><span class="badge" style="{{t.badgeStyle}}">{{t.badge}}</span></sc-if>
      </button>
      </sc-if>
    </sc-for>
  </nav>

  <main style="position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; overflow: hidden">

    <div style="display: flex; align-items: center; gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 15px; font-weight: 600; color: #e6fff0">Plan</h1>
        <span style="font-size: 12px; color: #7fae8c">{{summary}}</span>
      </div>
      <button class="btn sm" onClick="{{expandAll}}">Expand all</button>
      <button class="btn sm" onClick="{{collapseAll}}">Collapse</button>
    </div>

    <div style="display: flex; gap: 3px; height: 6px; border-radius: 3px; overflow: hidden" role="img" aria-label="{{barLabel}}">
      <sc-for list="{{bar}}" as="b"><div style="{{b.style}}"></div></sc-for>
    </div>

    <section class="card" role="tree" aria-label="Plan tree" style="padding: 8px; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{phases}}" as="p">
        <div role="treeitem" aria-expanded="{{p.x}}" style="display: flex; flex-direction: column">
          <button class="node" onClick="{{p.toggle}}" style="padding: 8px 6px">
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#8bbf9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{p.chev}}"><path d="m9 6 6 6-6 6"></path></svg>
            <span style="{{p.swatch}}"></span>
            <span style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0">
              <span style="font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #8bbf9a">{{p.label}}</span>
              <span style="font-size: 13.5px; font-weight: 600; color: #e6fff0">{{p.title}}</span>
            </span>
            <span class="cnt">{{p.count}}</span>
            <span class="pill" style="{{p.pillStyle}}">{{p.status}}</span>
          </button>
          <sc-if value="{{p.open}}">
          <div class="kids" role="group" style="margin-bottom: 6px">
            <sc-for list="{{p.tasks}}" as="t">
              <div role="treeitem" aria-expanded="{{t.x}}" style="display: flex; flex-direction: column">
                <button class="node" onClick="{{t.toggle}}" style="padding: 7px 6px">
                  <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#7fae8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{t.chev}}"><path d="m9 6 6 6-6 6"></path></svg>
                  <span class="mono" style="font-size: 11px; color: #7fae8c; width: 44px; overflow: hidden; text-overflow: ellipsis">{{t.id}}</span>
                  <span style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0">
                    <span style="font-size: 12.5px; color: #e6fff0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span>
                    <span style="font-size: 11px; color: #7fae8c">{{t.meta}}</span>
                  </span>
                  <span class="cnt">{{t.count}}</span>
                  <span class="pill" style="{{t.pillStyle}}">{{t.status}}</span>
                </button>
                <sc-if value="{{t.open}}">
                <div class="kids" role="group" style="margin-bottom: 4px">
                  <sc-for list="{{t.subs}}" as="s">
                    <div role="treeitem" style="display: flex; align-items: center; gap: 8px; padding: 5px 6px">
                      <span class="dot" aria-hidden="true">
                        <sc-if value="{{s.isDone}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#19e35a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
                        <sc-if value="{{s.isDot}}"><span style="{{s.dotStyle}}"></span></sc-if>
                      </span>
                      <span class="mono" style="font-size: 10.5px; color: #7fae8c; width: 44px; overflow: hidden; text-overflow: ellipsis">{{s.id}}</span>
                      <span style="{{s.textStyle}}">{{s.title}}</span>
                      <span style="{{s.noteStyle}}">{{s.note}}</span>
                    </div>
                  </sc-for>
                  <sc-if value="{{t.canRetry}}">
                    <div style="padding: 4px 6px">
                      <button class="btn sm" onClick="{{t.retry}}">Retry task</button>
                    </div>
                  </sc-if>
                </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
          </sc-if>
        </div>
      </sc-for>
      <sc-if value="{{hasNoPhases}}">
        <div style="padding: 24px; text-align: center; color: #7fae8c; font-size: 13px">No plan phases found</div>
      </sc-if>
    </section>

    <div style="display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: #8bbf9a; padding: 0 2px">
      <span style="display: inline-flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #19e35a"></span>Done</span>
      <span style="display: inline-flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #4fd1c5"></span>Working</span>
      <span style="display: inline-flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #e8b04a"></span>Waiting on you</span>
      <span style="display: inline-flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; border: 1px dashed #7fae8c; box-sizing: border-box"></span>Blocked</span>
      <span style="display: inline-flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #5f9a70; box-sizing: border-box"></span>Pending</span>
      <span style="display: inline-flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #ff9b8a"></span>Failed</span>
    </div>

  </main>

  <footer style="position: relative; z-index: 1; border-top: 1px solid #0f2a17; background: rgba(3,10,6,.92); backdrop-filter: blur(4px)">
    <div role="toolbar" aria-label="Shortcuts" style="display: flex; gap: 8px; padding: 12px 16px 16px; flex-wrap: wrap">
      <button class="btn pri" aria-label="Improve prompt" onClick="{{sweepLanes}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 17v4M17 19h4"></path></svg>Sweep<span class="kbd">⌃I</span></button>
      <button class="slot" disabled="" aria-label="Empty shortcut slot">+ shortcut</button>
      <button class="slot" disabled="" aria-label="Empty shortcut slot">+</button>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":1240}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { open: {} };
  }

  statusInfo(st) {
    const s = String(st || 'pending').toLowerCase();
    if (s === 'done' || s === 'completed') return ['Done', 'background:#123a1e;color:#19e35a', '#19e35a'];
    if (s === 'working' || s === 'dispatched') return ['Working', 'background:#0a2f2c;color:#4fd1c5', '#4fd1c5'];
    if (s === 'waiting') return ['Waiting on you', 'background:#221b08;color:#e8b04a', '#e8b04a'];
    if (s === 'blocked') return ['Blocked', 'background:#0b1c10;color:#8bbf9a', '#7fae8c'];
    if (s === 'ready') return ['Ready', 'background:#0b1c10;color:#b9e8c4', '#b9e8c4'];
    if (s === 'failed') return ['Failed', 'background:#3a1512;color:#ff9b8a', '#ff9b8a'];
    return ['Pending', 'background:#0b1c10;color:#7fae8c', '#5f9a70'];
  }

  renderVals() {
    const s = this.state;
    const plan = this.getData('plan') || {};
    const badges = this.getBadges() || {};
    const meta = this.getMeta() || {};

    const rawPhases = plan.phases || [];
    let nTasks = 0, nTasksDone = 0, nSubs = 0;

    const flip = (k) => () => {
      this.setState({ open: { ...s.open, [k]: !s.open[k] } });
    };

    const phases = rawPhases.map((p, idx) => {
      const pTasks = p.tasks || [];
      nTasks += pTasks.length;
      let pDone = 0;
      for (const t of pTasks) {
        if (t.status === 'done' || t.status === 'completed') pDone++;
      }
      nTasksDone += pDone;

      const pId = p.id || `ph${idx + 1}`;
      const isPOpen = s.open[pId] !== false; // default open
      const pSt = this.statusInfo(p.status);

      const tasks = pTasks.map((t, tIdx) => {
        const tId = t.id || t.code || `T${tIdx + 1}`;
        const isTOpen = s.open[tId] !== false;
        const tSt = this.statusInfo(t.status);
        const subs = (t.subs || []).map((sub) => {
          const sId = Array.isArray(sub) ? sub[0] : (sub.id || sub.code || '');
          const sTitle = Array.isArray(sub) ? sub[1] : (sub.title || '');
          const sStatus = Array.isArray(sub) ? sub[2] : (sub.status || '');
          const sNote = Array.isArray(sub) ? (sub[3] || '') : (sub.note || '');
          nSubs++;
          const isDone = sStatus === 'done' || sStatus === 'completed';
          const isWorking = sStatus === 'working';
          const isWaiting = sStatus === 'waiting';
          const isFailed = sStatus === 'failed';
          const dotColor = isWorking ? '#4fd1c5' : (isWaiting ? '#e8b04a' : (isFailed ? '#ff9b8a' : '#5f9a70'));

          return {
            id: sId,
            title: sTitle,
            isDone,
            isDot: !isDone,
            dotStyle: `width:7px;height:7px;border-radius:50%;background:${dotColor}`,
            textStyle: isDone ? 'font-size:12px;color:#7fae8c;text-decoration:line-through' : 'font-size:12px;color:#b9e8c4',
            note: sNote,
            noteStyle: 'font-size:11px;color:#7fae8c;margin-left:auto',
          };
        });

        const doneSubs = subs.filter((x) => x.isDone).length;
        const canRetry = t.status === 'failed';

        return {
          id: tId,
          title: t.title || 'Task',
          meta: t.meta || (t.lane ? `${t.lane} · ${t.agent || ''}` : 'unassigned'),
          count: `${doneSubs}/${subs.length}`,
          status: tSt[0],
          pillStyle: tSt[1],
          open: isTOpen,
          x: String(isTOpen),
          chev: isTOpen ? 'transform:rotate(90deg)' : '',
          toggle: flip(tId),
          subs,
          canRetry,
          retry: () => this.action('task.retry', { taskId: t.orcaTaskId || t.id }),
        };
      });

      return {
        id: pId,
        label: p.label || `Phase ${idx + 1}`,
        title: p.title || 'Phase',
        status: pSt[0],
        pillStyle: pSt[1],
        swatch: `width:4px;height:30px;border-radius:2px;flex-shrink:0;background:${pSt[2]}`,
        count: `${pDone}/${pTasks.length}`,
        open: isPOpen,
        x: String(isPOpen),
        chev: isPOpen ? 'transform:rotate(90deg)' : '',
        toggle: flip(pId),
        tasks,
      };
    });

    const bar = phases.map((p) => {
      const parts = p.count.split('/');
      const d = parseInt(parts[0], 10) || 0;
      const tot = parseInt(parts[1], 10) || 1;
      const pct = Math.round((d / tot) * 100);
      return {
        style: `flex:1;background:${pct >= 100 ? '#19e35a' : (pct > 0 ? '#4fd1c5' : '#12301f')};border-radius:2px`,
      };
    });

    const expandAll = () => {
      const o = {};
      phases.forEach((p) => {
        o[p.id] = true;
        p.tasks.forEach((t) => { o[t.id] = true; });
      });
      this.setState({ open: o });
    };

    const collapseAll = () => {
      const o = {};
      phases.forEach((p) => {
        o[p.id] = false;
        p.tasks.forEach((t) => { o[t.id] = false; });
      });
      this.setState({ open: o });
    };

    return {
      rain: window.MK_RAIN(23),
      tabs: window.MK_TABS('plan', badges, (t) => {}),
      planTitle: meta.planId || plan.title || 'MatrixKoder Plan',
      summary: `${phases.length} phases · ${nTasksDone}/${nTasks} tasks done · ${nSubs} subtasks`,
      barLabel: `${nTasksDone} of ${nTasks} tasks done`,
      bar,
      phases,
      hasNoPhases: phases.length === 0,
      expandAll,
      collapseAll,
      sweepLanes: () => this.action('sweep-lanes', {}),
    };
  }
}
</script>
</body>
</html>
