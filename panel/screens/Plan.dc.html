            </sc-for>
          </div>
          </sc-if>
        </div>

    const flip = (k) => () => this.setState({ open: { ...open, [k]: !open[k] } });
    let nTasks = 0, nTasksDone = 0, nSubs = 0;
    const phases = PLAN.map((p) => {
      const done = p.tasks.filter((t) => t.status === 'done').length;
      nTasks += p.tasks.length; nTasksDone += done;
      return {
        label: p.label, title: p.title,
        status: ST[p.status][0], pillStyle: ST[p.status][1],
        swatch: 'width:4px;height:30px;border-radius:2px;flex-shrink:0;background:' + ST[p.status][2],
        count: done + '/' + p.tasks.length,
        open: !!open[p.id], x: String(!!open[p.id]), chev: open[p.id] ? R90 : '',
        toggle: flip(p.id),
        tasks: p.tasks.map((t) => {
          const sd = t.subs.filter((x) => x[2] === 'done').length;
          nSubs += t.subs.length;
          return {
            id: t.id, title: t.title, meta: t.meta,
            status: t.status === 'blocked' ? 'Blocked · ' + t.note : ST[t.status][0], pillStyle: ST[t.status][1],
            count: sd + '/' + t.subs.length,
            open: !!open[t.id], x: String(!!open[t.id]), chev: open[t.id] ? R90 : '',
            toggle: flip(t.id),
            subs: t.subs.map(([id, title, st, note]) => ({
              id, title, note: note || '',
              isDone: st === 'done', isDot: st !== 'done',
              dotStyle: st === 'blocked' ? 'width:9px;height:9px;border-radius:2px;border:1.5px dashed #7fae8c;box-sizing:border-box'
                : st === 'pending' ? 'width:9px;height:9px;border-radius:50%;border:1.5px solid #5f9a70;box-sizing:border-box'
                : 'width:9px;height:9px;border-radius:50%;background:' + ST[st][2] + ';box-shadow:0 0 0 3px ' + (st === 'waiting' ? 'rgba(232,176,74,.2)' : 'rgba(79,209,197,.2)'),
              textStyle: 'flex:1;min-width:0;font-size:12px;' + (st === 'done' ? 'color:#8bbf9a' : st === 'pending' ? 'color:#a3c9ad' : 'color:#e6fff0'),
              noteStyle: 'font-size:11px;font-weight:600;white-space:nowrap;color:' + ST[st][2],
            })),
          };
        }),
      };
    });
    const segs = PLAN.map((p) => ({ style: 'flex:' + p.tasks.length + ';background:' + (p.status === 'done' ? '#19e35a' : p.status === 'working' ? 'linear-gradient(90deg,#19e35a 40%,#4fd1c5 40% 60%,#e8b04a 60% 80%,#12301f 80%)' : '#12301f') }));
    return {
      rain: RAIN,
      tabs: tabs('plan'),
      summary: PLAN.length + ' phases · ' + nTasksDone + '/' + nTasks + ' tasks done · ' + nSubs + ' subtasks',
      bar: segs,
      barLabel: nTasksDone + ' of ' + nTasks + ' tasks done',
      phases,
      expandAll: () => this.setState({ open: allOpen() }),
      collapseAll: () => this.setState({ open: {} }),
    };
  }
}
</script>
