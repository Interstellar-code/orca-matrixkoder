<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MatrixKoder Lanes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#4fd1c5}a:hover{color:#7fe3d9}
.mk{font-family:'Geist',system-ui,sans-serif;color:#b9e8c4;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #143d22;background:#06150b;color:#8bbf9a;cursor:pointer;padding:0;text-decoration:none;box-sizing:border-box}
.ib:hover{background:#0c2414;color:#b9e8c4}
.btn{font-family:'Geist',system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid #143d22;background:#06150b;color:#b9e8c4;text-decoration:none;box-sizing:border-box}
.btn:hover{background:#0c2414;color:#b9e8c4}
.btn.pri{background:#19e35a;border-color:#19e35a;color:#021006;font-weight:600}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.tab{font-family:'Geist',system-ui,sans-serif;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 9px;border:0;border-radius:9px;background:transparent;color:#7fae8c;font-size:10px;font-weight:500;letter-spacing:-.01em;cursor:pointer;position:relative;white-space:nowrap;text-decoration:none}
.tab:hover{color:#b9e8c4;background:#06150b}
.tab.on{background:#0d2a16;color:#e6fff0}
.badge{position:absolute;top:3px;right:4px;min-width:16px;height:16px;border-radius:8px;font-size:10px;font-weight:600;line-height:16px;text-align:center;padding:0 4px;box-sizing:border-box}
.rain{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.rcol{position:absolute;top:0;width:14px;font-family:'Geist Mono',ui-monospace,monospace;font-size:13px;line-height:15px;text-align:center;white-space:pre-line;color:#19e35a;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 85%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 85%,#000 100%);animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{from{transform:translateY(-110%)}to{transform:translateY(1300px)}}
.slot{font-family:'Geist',system-ui,sans-serif;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:9px;border:1px dashed #1c4a2b;background:transparent;color:#5f9a70;font-size:12px;cursor:default}
.kbd{font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.18);margin-left:2px}
.card{border-radius:14px;background:rgba(4,17,10,.84);backdrop-filter:blur(3px);border:1px solid #0f2a17}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:600;white-space:nowrap}
.p-teal{background:#0a2f2c;color:#4fd1c5}.p-amb{background:#221b08;color:#e8b04a}.p-grn{background:#123a1e;color:#19e35a}.p-red{background:#3a1512;color:#ff9b8a}.p-dim{background:#0b1c10;color:#8bbf9a}
.fchip{font-family:'Geist',system-ui,sans-serif;height:30px;padding:0 12px;border-radius:15px;border:1px solid #143d22;background:rgba(6,21,11,.85);color:#8bbf9a;font-size:12px;cursor:pointer}
.fchip:hover{color:#e6fff0}
.fchip.on{background:#0d2a16;border-color:#19e35a;color:#e6fff0}
.gate{border-radius:10px;background:#020a05;border:1px solid #0f2a17;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span:first-child{font-size:11px;color:#7fae8c}
.kv span:last-child{font-family:'Geist Mono',ui-monospace,monospace;font-size:11.5px;color:#e6fff0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp{font-family:'Geist',system-ui,sans-serif;border:0;background:transparent;padding:0;margin:0;display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;color:inherit}
</style>
</helmet>
<div class="mk" style="width: 440px; height: 1240px; box-sizing: border-box; background: #020604; display: flex; flex-direction: column; border-left: 1px solid #0f2a17; position: relative; overflow: hidden">

  <div class="rain" aria-hidden="true">
    <sc-for list="{{rain}}" as="c" hint-placeholder-count="0">
      <div class="rcol" style="{{c.style}}">{{c.glyphs}}</div>
    </sc-for>
  </div>

  <header style="position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px">
    <div style="width: 30px; height: 30px; border-radius: 8px; background: #0d2a16; border: 1px solid #19e35a; display: flex; align-items: center; justify-content: center; color: #19e35a">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5z"></path><path d="m2 17 10 5 10-5"></path><path d="m2 12 10 5 10-5"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
      <span style="font-size: 14px; font-weight: 700; letter-spacing: .02em; color: #e6fff0">MatrixKoder</span>
      <button style="font-family: 'Geist', system-ui, sans-serif; align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; color: #8bbf9a; font-size: 12px; cursor: pointer; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{planTitle}} <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>
    <button class="ib" aria-label="Sweep lanes now" onClick="{{sweepLanes}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg></button>
    <a class="ib" href="Settings.dc.html" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg></a>
  </header>

  <nav aria-label="MatrixKoder sections" style="position: relative; z-index: 1; display: flex; gap: 2px; margin: 0 10px; padding: 4px; border-radius: 12px; background: rgba(4,14,7,.86); backdrop-filter: blur(3px); border: 1px solid #0f2a17">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="8">
      <sc-if value="{{t.isLink}}" hint-placeholder-val="{{true}}">
      <a class="{{t.cls}}" href="{{t.href}}" aria-current="{{t.cur}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
        <sc-if value="{{t.hasBadge}}" hint-placeholder-val="{{false}}"><span class="badge" style="{{t.badgeStyle}}">{{t.badge}}</span></sc-if>
      </a>
      </sc-if>
      <sc-if value="{{t.isBtn}}" hint-placeholder-val="{{false}}">
      <button class="{{t.cls}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
        <sc-if value="{{t.hasBadge}}" hint-placeholder-val="{{false}}"><span class="badge" style="{{t.badgeStyle}}">{{t.badge}}</span></sc-if>
      </button>
      </sc-if>
    </sc-for>
  </nav>

  <main style="position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; overflow: hidden">

    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600; color: #e6fff0">Lanes</h1>
      <span style="font-size: 12px; color: #7fae8c">{{summaryText}}</span>
      <span style="flex: 1"></span>
      <button class="btn sm" onClick="{{addLane}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add lane</button>
    </div>

    <div role="group" aria-label="Filter lanes" style="display: flex; gap: 6px; flex-wrap: wrap">
      <sc-for list="{{filters}}" as="f">
        <button class="{{f.cls}}" aria-pressed="{{f.p}}" onClick="{{f.pick}}">{{f.label}}</button>
      </sc-for>
    </div>

    <sc-for list="{{laneList}}" as="l">
      <article class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 12px; {{l.cardBorder}}">
        <button class="exp" aria-expanded="{{l.exp}}" onClick="{{l.toggle}}">
          <span style="width: 34px; height: 34px; border-radius: 9px; {{l.badgeStyle}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0">{{l.label}}</span>
          <span style="display: flex; flex-direction: column; flex: 1; min-width: 0; gap: 1px">
            <span style="font-size: 13px; font-weight: 600; color: #e6fff0">{{l.agent}} <span style="font-weight: 400; color: #8bbf9a">· {{l.modelEffort}}</span></span>
            <span class="mono" style="font-size: 11px; color: #7fae8c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.branchHead}}</span>
          </span>
          <span class="pill {{l.pillCls}}">{{l.status}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7fae8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{l.chevStyle}}"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        <sc-if value="{{l.isOpen}}">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 11px; color: #7fae8c">{{l.taskMeta}}</span>
            <span style="font-size: 13px; line-height: 18px; color: #e6fff0">{{l.taskTitle}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px">
            <div class="kv"><span>Worktree</span><span>{{l.worktreePath}}</span></div>
            <div class="kv"><span>Commits</span><span>{{l.commitsAhead}}</span></div>
            <div class="kv"><span>Started</span><span>{{l.startedTime}}</span></div>
            <div class="kv"><span>Changes</span><span>{{l.changesStat}}</span></div>
          </div>
          <sc-if value="{{l.hasGates}}">
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{l.gates}}" as="g">
              <div class="gate" style="{{g.style}}"><span style="font-size: 11px; color: #8bbf9a">{{g.name}}</span><span style="font-size: 12px; font-weight: 600; {{g.valStyle}}">{{g.status}}</span><span class="mono" style="font-size: 10.5px; color: #7fae8c">{{g.sub}}</span></div>
            </sc-for>
          </div>
          </sc-if>
          <sc-if value="{{l.hasActivity}}">
          <div class="mono" style="border-radius: 10px; background: #010402; border: 1px solid #0f2a17; padding: 10px 12px; font-size: 11.5px; line-height: 18px; color: #8bbf9a">
            <sc-for list="{{l.activity}}" as="act">
              <div><span style="color: #5f9a70">{{act.time}}</span> {{act.text}}</div>
            </sc-for>
          </div>
          </sc-if>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            <button class="btn sm" onClick="{{l.openTerm}}">Terminal</button>
            <button class="btn sm" onClick="{{l.openDiff}}">Diff</button>
            <button class="btn sm" onClick="{{l.pause}}">Pause</button>
            <button class="btn sm" onClick="{{l.handoff}}">Hand off</button>
          </div>
        </div>
        </sc-if>
      </article>
    </sc-for>

    <sc-if value="{{hasNoLanes}}">
      <div style="border-radius: 12px; background: rgba(4,17,10,.84); border: 1px solid #0f2a17; padding: 24px; text-align: center; color: #7fae8c; font-size: 13px">No lanes in this filter</div>
    </sc-if>

  </main>

  <footer style="position: relative; z-index: 1; border-top: 1px solid #0f2a17; background: rgba(3,10,6,.92); backdrop-filter: blur(4px)">
    <div role="toolbar" aria-label="Shortcuts" style="display: flex; gap: 8px; padding: 12px 16px 16px; flex-wrap: wrap">
      <button class="btn pri" aria-label="Improve prompt" onClick="{{sweepLanes}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 17v4M17 19h4"></path></svg>Sweep<span class="kbd">⌃I</span></button>
      <button class="slot" disabled="" aria-label="Empty shortcut slot">+ shortcut</button>
      <button class="slot" disabled="" aria-label="Empty shortcut slot">+</button>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":1240}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { f: 'all', open: { P1: true } };
  }

  renderVals() {
    const s = this.state;
    const lanes = this.getData('lanes') || [];
    const badges = this.getBadges() || {};
    const meta = this.getMeta() || {};

    let nWorking = 0, nWaiting = 0, nIdle = 0, nFailed = 0;
    for (const l of lanes) {
      if (l.state === 'working') nWorking++;
      else if (l.state === 'waiting') nWaiting++;
      else if (l.state === 'failed') nFailed++;
      else nIdle++;
    }

    const filters = [
      { id: 'all', label: `All ${lanes.length}` },
      { id: 'working', label: `Working ${nWorking}` },
      { id: 'waiting', label: `Waiting ${nWaiting}` },
      { id: 'idle', label: `Idle ${nIdle}` },
    ];
    if (nFailed > 0) {
      filters.push({ id: 'failed', label: `Failed ${nFailed}` });
    }

    const filtered = lanes.filter((l) => {
      if (s.f === 'all') return true;
      if (s.f === 'idle') return l.state !== 'working' && l.state !== 'waiting' && l.state !== 'failed';
      return l.state === s.f;
    });

    const laneList = filtered.map((l) => {
      const isWorking = l.state === 'working';
      const isWaiting = l.state === 'waiting';
      const isFailed = l.state === 'failed';
      const isOpen = !!s.open[l.label];

      const badgeStyle = isWaiting ? 'background:#221b08;color:#e8b04a' : (isWorking ? 'background:#0a2f2c;color:#4fd1c5' : (isFailed ? 'background:#3a1512;color:#ff9b8a' : 'background:#0b1c10;color:#8bbf9a'));
      const pillCls = isWaiting ? 'p-amb' : (isWorking ? 'p-teal' : (isFailed ? 'p-red' : 'p-dim'));
      const cardBorder = isWaiting ? 'border-color:#3d2f10' : (isFailed ? 'border-color:#5c1512' : '');
      const status = isWorking ? `Working · turn ${l.turns || 1}` : (isWaiting ? 'Waiting on you' : (isFailed ? 'Failed' : 'Idle'));

      const chk = l.checks || [];
      const gates = chk.map((c) => {
        const passed = c.status === 'passed';
        const running = c.status === 'running';
        const valStyle = passed ? 'color:#19e35a' : (running ? 'color:#4fd1c5' : 'color:#8bbf9a');
        const stText = passed ? 'Passed' : (running ? 'Running' : 'Not started');
        const sub = c.passed && c.total ? `${c.passed} / ${c.total}` : (passed ? 'verified' : (running ? 'in progress' : ''));
        return { name: c.name, status: stText, valStyle, sub, style: running ? 'border-color:#1f6b5f' : '' };
      });

      const actList = (l.activity || []).map((a) => {
        const d = new Date(a.at || Date.now());
        const time = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        return { time, text: a.text || a.kind || '' };
      });

      const git = l.git || {};
      const changesStat = `${git.files || 0} files · +${git.added || 0} −${git.removed || 0}`;

      return {
        label: l.label || 'P',
        agent: l.agent || 'Agent',
        modelEffort: [l.model, l.effort].filter(Boolean).join(' · ') || 'auto',
        branchHead: `${l.branch || 'main'} · ${(l.head || '').slice(0, 7)}`,
        status,
        badgeStyle,
        pillCls,
        cardBorder,
        chevStyle: isOpen ? 'transform:rotate(180deg)' : '',
        exp: isOpen ? 'true' : 'false',
        isOpen,
        taskMeta: `Task ${(l.task && l.task.id) || 'T'} · wave ${(l.task && l.task.wave) || 1}`,
        taskTitle: (l.task && l.task.title) || 'Active dispatch',
        worktreePath: l.path || '~',
        commitsAhead: `${git.ahead || 0} ahead of main`,
        startedTime: l.startedAt ? `${Math.max(1, Math.round((Date.now() - l.startedAt) / 60000))}m ago` : 'just now',
        changesStat,
        hasGates: gates.length > 0,
        gates,
        hasActivity: actList.length > 0,
        activity: actList,
        toggle: () => {
          this.setState({ open: { ...s.open, [l.label]: !isOpen } });
        },
        openTerm: () => this.action('terminal send', { terminal: l.terminalHandle || 'term_1', text: '' }),
        openDiff: () => this.action('tab create', { url: `diff:${l.path || ''}` }),
        pause: () => this.action('terminal send', { terminal: l.terminalHandle || 'term_1', text: '\x1b' }),
        handoff: () => this.action('worker-start', { spec: `Hand off ${l.label}`, agent: 'claude' }),
      };
    });

    const filterObjs = filters.map((f) => ({
      label: f.label,
      p: s.f === f.id ? 'true' : 'false',
      cls: 'fchip' + (s.f === f.id ? ' on' : ''),
      pick: () => this.setState({ f: f.id }),
    }));

    return {
      rain: window.MK_RAIN(11),
      tabs: window.MK_TABS('lanes', badges, (t) => {}),
      planTitle: meta.planId || 'MatrixKoder Plan',
      summaryText: `${lanes.length} worktrees · ${badges.waiting || 0} waiting on you`,
      filters: filterObjs,
      laneList,
      hasNoLanes: laneList.length === 0,
      addLane: () => this.action('worker-start', { spec: 'New lane', agent: 'claude' }),
      sweepLanes: () => this.action('sweep-lanes', {}),
    };
  }
}
</script>
</body>
</html>
