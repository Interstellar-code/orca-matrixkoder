<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings · Safety</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#4fd1c5}a:hover{color:#7fe3d9}
.mk{font-family:'Geist',system-ui,sans-serif;color:#b9e8c4;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #143d22;background:#06150b;color:#8bbf9a;cursor:pointer;padding:0;text-decoration:none;box-sizing:border-box}
.ib:hover{background:#0c2414;color:#b9e8c4}
.btn{font-family:'Geist',system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #143d22;background:#06150b;color:#b9e8c4;text-decoration:none;box-sizing:border-box;white-space:nowrap}
.btn:hover{background:#0c2414;color:#b9e8c4}
.rain{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.rcol{position:absolute;top:0;width:14px;font-family:'Geist Mono',ui-monospace,monospace;font-size:13px;line-height:15px;text-align:center;white-space:pre-line;color:#19e35a;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 85%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 85%,#000 100%);animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{from{transform:translateY(-110%)}to{transform:translateY(1300px)}}
.stab{font-family:'Geist',system-ui,sans-serif;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:7px;color:#7fae8c;font-size:9.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.stab:hover{color:#b9e8c4;background:#06150b}
.stab.on{background:#0d2a16;color:#e6fff0}
.card{border-radius:14px;background:rgba(4,17,10,.86);backdrop-filter:blur(3px);border:1px solid #0f2a17;padding:4px 14px}
.sec{margin:0;padding:12px 0 6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8bbf9a}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #0d2414}
.lbl{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.lbl span:first-child{font-size:13px;color:#e6fff0}
.lbl span:last-child{font-size:11.5px;line-height:16px;color:#7fae8c}
.search{font-family:'Geist',system-ui,sans-serif;width:100%;height:36px;box-sizing:border-box;padding:0 12px 0 34px;border-radius:9px;border:1px solid #1c4a2b;background:#020a05;color:#e6fff0;font-size:13px;outline:none}
.search:focus{border-color:#19e35a}
.search::placeholder{color:#5f9a70}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sw{width:44px;height:26px;border-radius:13px;border:1px solid #1c4a2b;background:#0b1c10;position:relative;cursor:pointer;padding:0;flex-shrink:0}
.sw .kn{position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:#5f9a70;transition:left .15s}
.sw.on{background:#19e35a;border-color:#19e35a}
.sw.on .kn{left:22px;background:#021006}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 4px 0 10px;border-radius:13px;background:#0d2a16;border:1px solid #145a2a;font-family:'Geist Mono',ui-monospace,monospace;font-size:11.5px;color:#e6fff0}
.chip button{border:0;background:transparent;color:#8bbf9a;cursor:pointer;width:20px;height:20px;border-radius:10px;padding:0;display:flex;align-items:center;justify-content:center}
.chip button:hover{background:#145a2a;color:#e6fff0}
.inp{font-family:'Geist',system-ui,sans-serif;flex:1;min-width:0;height:32px;box-sizing:border-box;padding:0 10px;border-radius:8px;border:1px solid #1c4a2b;background:#020a05;color:#e6fff0;font-size:12.5px;outline:none}
.inp:focus{border-color:#19e35a}
.inp::placeholder{color:#5f9a70}
.cmd{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #0d2414}
</style>
</helmet>
<div class="mk" style="width: 440px; height: 1240px; box-sizing: border-box; background: #020604; display: flex; flex-direction: column; border-left: 1px solid #0f2a17; position: relative; overflow: hidden">

  <div class="rain" aria-hidden="true">
    <sc-for list="{{rain}}" as="c" hint-placeholder-count="0">
      <div class="rcol" style="{{c.style}}">{{c.glyphs}}</div>
    </sc-for>
  </div>

  <header style="position: relative; z-index: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 14px; border-bottom: 1px solid #0f2a17; background: rgba(3,10,6,.92)">
    <div style="display: flex; align-items: center; gap: 10px">
      <a class="ib" href="Main.dc.html" aria-label="Back to Overview"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 15px; font-weight: 600; color: #e6fff0">Settings</h1>
        <span style="font-size: 12px; color: #8bbf9a">MatrixKoder · {{repoName}}</span>
      </div>
    </div>
    <div style="position: relative">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7fae8c" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 12px; top: 11px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="ss" class="sr">Search settings</label>
      <input id="ss" class="search" placeholder="Search all settings">
    </div>
    <nav aria-label="Settings sections" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(4,14,7,.86); border: 1px solid #0f2a17">
      <sc-for list="{{stabs}}" as="s" hint-placeholder-count="7"><a class="{{s.cls}}" href="{{s.href}}" aria-current="{{s.cur}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg><span>{{s.label}}</span></a></sc-for>
    </nav>
  </header>

  <main style="position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 20px; overflow: hidden">

    <section class="card" aria-labelledby="s-guard">
      <h2 id="s-guard" class="sec">Guards</h2>
      <sc-for list="{{guards}}" as="t" hint-placeholder-count="4">
        <div class="row"><div class="lbl"><span>{{t.label}}</span><span>{{t.desc}}</span></div><button class="{{t.cls}}" aria-pressed="{{t.p}}" aria-label="{{t.label}}" onClick="{{t.flip}}"><span class="kn"></span></button></div>
      </sc-for>
      <div style="height: 4px"></div>
    </section>

    <section class="card" aria-labelledby="s-branch" style="padding-bottom: 14px">
      <h2 id="s-branch" class="sec">Protected branches</h2>
      <p style="margin: 0 0 10px; font-size: 11.5px; line-height: 16px; color: #7fae8c">Lanes never commit or push here. Merges into these wait for you.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px">
        <sc-for list="{{branches}}" as="b" hint-placeholder-count="2">
          <span class="chip">{{b.name}}<button aria-label="Remove {{b.name}}" onClick="{{b.remove}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px">
        <label for="br" class="sr">Branch or pattern</label>
        <input id="br" class="inp mono" placeholder="branch or pattern, e.g. hotfix/*" value="{{draft}}" onChange="{{setDraft}}">
        <button class="btn" onClick="{{addBranch}}">Add</button>
      </div>
    </section>

    <section class="card" aria-labelledby="s-cmd" style="padding-bottom: 8px">
      <h2 id="s-cmd" class="sec">Never run</h2>
      <p style="margin: 0 0 6px; font-size: 11.5px; line-height: 16px; color: #7fae8c">Commands a lane is stopped from running, even when its agent asks.</p>
      <sc-for list="{{cmds}}" as="c" hint-placeholder-count="4">
        <div class="cmd"><span class="mono" style="font-size: 12px; color: #ffc4b8; flex: 1">{{c}}</span></div>
      </sc-for>
      <div class="cmd"><button class="btn" style="border-style: dashed; color: #8bbf9a" onClick="{{addCmd}}">+ Add a command</button></div>
    </section>

  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":1240}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      on: { gitHard: true, rmrf: true, push: true, secrets: true },
      branches: ['main', 'release/*'],
      draft: '',
      cmds: ['git reset --hard', 'git push --force', 'git clean -fdx', 'rm -rf ~', 'npm publish'],
    };
  }
  renderVals() {
    const s = this.state;
    const proj = this.getData('projects') || {};
    const repo = (proj.repos && proj.repos[0]) || {};
    const repoName = repo.name || 'orca-matrixkoder';

    const guardDefs = [
      ['gitHard', 'Block destructive git', 'reset --hard, push --force, branch -D'],
      ['rmrf', 'Block deletes outside the worktree', 'A lane can only remove files in its own worktree'],
      ['push', 'Ask before git push', 'Every push waits for you in Waiting'],
      ['secrets', 'Scan diffs for secrets', 'Stops a commit that adds keys or tokens'],
    ];

    return {
      rain: window.MK_RAIN ? window.MK_RAIN(89) : [],
      stabs: window.MK_STABS ? window.MK_STABS('safety') : [],
      repoName,
      guards: guardDefs.map(([k, label, desc]) => ({
        label,
        desc,
        cls: 'sw' + (s.on[k] ? ' on' : ''),
        p: String(!!s.on[k]),
        flip: () => {
          const next = !s.on[k];
          const nextOn = Object.assign({}, s.on, { [k]: next });
          this.setState({ on: nextOn });
          this.action('settings save', { safety: nextOn });
        },
      })),
      branches: s.branches.map((name) => ({
        name,
        remove: () => {
          const next = s.branches.filter((b) => b !== name);
          this.setState({ branches: next });
          this.action('settings save', { protectedBranches: next });
        },
      })),
      draft: s.draft,
      setDraft: (e) => this.setState({ draft: e.target.value }),
      addBranch: () => {
        if (!s.draft.trim()) return;
        const next = [...s.branches, s.draft.trim()];
        this.setState({ branches: next, draft: '' });
        this.action('settings save', { protectedBranches: next });
      },
      cmds: s.cmds,
      addCmd: () => {
        this.action('settings save', { addCommand: true });
      },
    };
  }
}
</script>
</body>
</html>
